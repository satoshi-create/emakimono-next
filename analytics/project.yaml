# emakimono-next analytics project config
# Env vars (${NAME}) are expanded by scripts/analytics/_config.py

site:
  name: emakimono-next
  url: https://emakimono.com
  host: emakimono.com

gsc:
  site_url: ${GSC_SITE_URL}

ga4:
  property_id: ${GOOGLE_APPLICATION_PROPERTY_ID}
  # GA4 Admin でイベント param「emaki_id」「fallback_reason」をカスタムディメンション登録後に API 名を合わせる
  # 未登録の場合 viewer_by_emaki / fallback_by_emaki / fallback_by_reason はスキップされる
  custom_event_dimensions:
    emaki_id: customEvent:emaki_id
    fallback_reason: customEvent:fallback_reason
    scene_index: customEvent:scene_index
    choice: customEvent:choice
    platform: customEvent:platform
    # 観察力クイズ — GA4 Admin（イベントスコープ）登録後に有効
    quiz_id: customEvent:quiz_id
    question_id: customEvent:question_id
    is_correct: customEvent:is_correct
    rank: customEvent:rank

content:
  # 本番正本 image-metadata-cache を使用（local-data/ は gitignore 済みで CI に存在しない）
  emakis_json: src/data/image-metadata-cache/image-metadata-cache.json
  content_map: analytics/content-map.json
  slug_field: titleen

locale:
  strip_prefixes:
    - /ja
    - /en
