# GA4 event / param mapping — keep in sync with src/libs/api/measurementUtils.js and gtag callers

events:
  viewer_engagement:
    source: measurementUtils.js
    params:
      - emaki_id
      - max_scroll_ratio
      - scenes_visited
      - fullscreen_used
      - fallback_count
      - slow_count
    priority: P0

  scene_dwell:
    source: measurementUtils.js
    params:
      - emaki_id
      - scene_index
      - dwell_ms
    priority: P1

  scene_transition:
    source: measurementUtils.js
    params:
      - emaki_id
      - from_scene
      - to_scene
      - source
    priority: P1

  image_load_fallback:
    source: measurementUtils.js
    params:
      - emaki_id
      - image_index
      - fallback_reason
    priority: P1

  image_load_slow:
    source: measurementUtils.js
    params:
      - emaki_id
      - image_index
      - load_time_ms
      - threshold_ms
    priority: P2

  scene_modal_open:
    source: ModalDesc.js
    params:
      - emaki_id
      - scene_index
    priority: P1

  like_emaki:
    source: EmakiLikeIcon.js
    params:
      - emaki_id
    priority: P2

  scene_like:
    source: SceneLikeButton.js
    params:
      - emaki_id
      - scene_index
    priority: P2

  sns_share_click:
    source: ShareButtons.js
    params:
      - platform
      - emaki_id
      - scene_index
    priority: P2

  scroll_feedback:
    source: ScrollFeedbackPanel.js
    params:
      - emaki_id
      - choice
      - scene_index
    priority: P2

custom_dimensions:
  - param: emaki_id
    ga4_scope: event
    notes: Must be registered in GA4 Admin before Data API reports work
  - param: fallback_reason
    ga4_scope: event
    notes: "Values: priority_timeout | fullscreen_timeout. Register in GA4 Admin before fallback_by_reason works."
  - param: scene_index
    ga4_scope: event
    notes: Values are numeric scene indices (0-based).
  - param: choice
    ga4_scope: event
    notes: scroll_feedback の選択肢。Values: smooth | laggy | hard_to_read | confusing | great.
  - param: platform
    ga4_scope: event
    notes: sns_share_click の媒体。Values: copy | x | line | native. GA4 Admin 登録後に sns_share_by_platform が有効化。
