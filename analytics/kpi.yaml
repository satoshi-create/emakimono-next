# KPI definitions and report queries for fetch_all.py

phase: steady

bootstrap:
  min_gsc_rows: 10
  min_ga4_sessions: 50

date_ranges:
  # Weekly review window (single fetch aggregates the full range)
  current:
    start: 7daysAgo
    end: yesterday
  previous:
    start: 14daysAgo
    end: 8daysAgo

gsc_reports:
  - id: queries
    dimensions:
      - query
      - page
    row_limit: 1000
  - id: pages
    dimensions:
      - page
    row_limit: 500

ga4_reports:
  - id: pages
    dimensions:
      - pagePath
    metrics:
      - sessions
      - screenPageViews
      - engagementRate
      - averageSessionDuration
    limit: 500

  - id: events_summary
    dimensions:
      - eventName
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: in_list
      values:
        - viewer_engagement
        - scene_dwell
        - image_load_fallback
        - image_load_slow
        - session_context
        - scene_modal_open
        - like_emaki
        - sns_share_click
        - scene_like
        - scroll_feedback
        - quiz_start
        - quiz_answer
        - quiz_jump_to_scene
        - quiz_complete
    limit: 100

  # 地域・デバイス（教育利用クラスタの弱い代理指標）
  - id: sessions_by_region
    dimensions:
      - region
      - country
    metrics:
      - sessions
    limit: 100

  - id: sessions_by_city
    dimensions:
      - city
      - region
      - country
    metrics:
      - sessions
    limit: 200

  - id: sessions_by_region_device
    dimensions:
      - region
      - deviceCategory
    metrics:
      - sessions
    limit: 200

  - id: sessions_by_device
    dimensions:
      - deviceCategory
    metrics:
      - sessions
    limit: 10

  - id: sessions_by_day_of_week
    dimensions:
      - dayOfWeekName
    metrics:
      - sessions
    limit: 10

  - id: viewer_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: viewer_engagement
    limit: 200

  - id: fallback_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: image_load_fallback
    limit: 200

  - id: fallback_by_reason
    optional: true
    requires_custom_dimension: fallback_reason
    dimensions:
      - customEvent:fallback_reason
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: image_load_fallback
    limit: 50

  - id: slow_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: image_load_slow
    limit: 200

  # session_context（device_type / connection_type）。GA4 Admin 登録後に有効
  - id: session_context_by_device
    optional: true
    requires_custom_dimension: device_type
    dimensions:
      - customEvent:device_type
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: session_context
    limit: 20

  - id: session_context_by_connection
    optional: true
    requires_custom_dimension: connection_type
    dimensions:
      - customEvent:connection_type
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: session_context
    limit: 20

  - id: scene_like_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scene_like
    limit: 200

  - id: scene_like_by_scene
    optional: true
    requires_custom_dimension: scene_index
    dimensions:
      - customEvent:scene_index
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scene_like
    limit: 200

  - id: like_emaki_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: like_emaki
    limit: 200

  - id: scroll_feedback_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scroll_feedback
    limit: 200

  - id: scroll_feedback_by_choice
    optional: true
    requires_custom_dimension: choice
    dimensions:
      - customEvent:choice
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scroll_feedback
    limit: 50

  - id: sns_share_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: sns_share_click
    limit: 200

  - id: sns_share_by_platform
    optional: true
    requires_custom_dimension: platform
    dimensions:
      - customEvent:platform
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: sns_share_click
    limit: 50

  # 観察力クイズ（DB なし・イベント集計のみ）
  - id: quiz_start_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_start
    limit: 200

  - id: quiz_complete_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_complete
    limit: 200

  - id: quiz_jump_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_jump_to_scene
    limit: 200

  - id: quiz_answer_by_question
    optional: true
    requires_custom_dimension: question_id
    dimensions:
      - customEvent:question_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_answer
    limit: 50

  - id: quiz_answer_by_question_correctness
    optional: true
    requires_custom_dimension: question_id
    dimensions:
      - customEvent:question_id
      - customEvent:is_correct
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_answer
    limit: 100

  - id: quiz_complete_by_rank
    optional: true
    requires_custom_dimension: rank
    dimensions:
      - customEvent:rank
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_complete
    limit: 20

  - id: quiz_jump_by_question
    optional: true
    requires_custom_dimension: question_id
    dimensions:
      - customEvent:question_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: quiz_jump_to_scene
    limit: 50

merge:
  insight_thresholds:
    low_ctr_vs_site_ratio: 0.7
    low_engagement_scroll_ratio: 0.5
    high_fallback_events: 50
    # 観察力クイズ（event 件数ベース。ユニークユーザーではない）
    min_quiz_starts_for_ratio: 20
    low_quiz_completion_ratio: 0.4
    low_quiz_jump_ratio: 0.2
    # 地域クラスタ（教育利用の弱い代理。確定ではない）
    min_region_cluster_sessions: 30
    min_city_cluster_sessions: 30
