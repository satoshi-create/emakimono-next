# KPI definitions and report queries for fetch_all.py

phase: steady

bootstrap:
  min_gsc_rows: 10
  min_ga4_sessions: 50

date_ranges:
  # Weekly review window (single fetch aggregates the full range)
  current:
    start: 7daysAgo
    end: yesterday
  previous:
    start: 14daysAgo
    end: 8daysAgo

gsc_reports:
  - id: queries
    dimensions:
      - query
      - page
    row_limit: 1000
  - id: pages
    dimensions:
      - page
    row_limit: 500

ga4_reports:
  - id: pages
    dimensions:
      - pagePath
    metrics:
      - sessions
      - screenPageViews
      - engagementRate
      - averageSessionDuration
    limit: 500

  - id: events_summary
    dimensions:
      - eventName
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: in_list
      values:
        - viewer_engagement
        - scene_dwell
        - image_load_fallback
        - image_load_slow
        - scene_modal_open
        - like_emaki
        - sns_share_click
        - scene_like
        - scroll_feedback
    limit: 100

  - id: viewer_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: viewer_engagement
    limit: 200

  - id: fallback_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: image_load_fallback
    limit: 200

  - id: fallback_by_reason
    optional: true
    requires_custom_dimension: fallback_reason
    dimensions:
      - customEvent:fallback_reason
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: image_load_fallback
    limit: 50

  - id: scene_like_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scene_like
    limit: 200

  - id: scene_like_by_scene
    optional: true
    requires_custom_dimension: scene_index
    dimensions:
      - customEvent:scene_index
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scene_like
    limit: 200

  - id: like_emaki_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: like_emaki
    limit: 200

  - id: scroll_feedback_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scroll_feedback
    limit: 200

  - id: scroll_feedback_by_choice
    optional: true
    requires_custom_dimension: choice
    dimensions:
      - customEvent:choice
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: scroll_feedback
    limit: 50

  - id: sns_share_by_emaki
    optional: true
    requires_custom_dimension: emaki_id
    dimensions:
      - customEvent:emaki_id
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: sns_share_click
    limit: 200

  - id: sns_share_by_platform
    optional: true
    requires_custom_dimension: platform
    dimensions:
      - customEvent:platform
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: exact
      value: sns_share_click
    limit: 50

  # Geo / traffic quality (session scope)
  - id: geo_country
    dimensions:
      - country
    metrics:
      - sessions
      - engagedSessions
      - engagementRate
      - averageSessionDuration
      - bounceRate
      - totalUsers
      - userEngagementDuration
    limit: 100

  - id: geo_japan_region
    dimensions:
      - region
    metrics:
      - sessions
      - engagedSessions
      - engagementRate
      - averageSessionDuration
      - bounceRate
    dimension_filter:
      field: country
      op: exact
      value: Japan
    limit: 50

  - id: geo_country_channel
    dimensions:
      - country
      - sessionDefaultChannelGroup
    metrics:
      - sessions
      - engagementRate
      - averageSessionDuration
    limit: 300

  - id: geo_country_device
    dimensions:
      - country
      - deviceCategory
    metrics:
      - sessions
      - engagementRate
      - averageSessionDuration
    limit: 300

  # Viewer events by country (bot / low-quality traffic detection)
  - id: events_by_country
    dimensions:
      - country
      - eventName
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: in_list
      values:
        - viewer_engagement
        - scene_dwell
        - image_load_fallback
    limit: 500

  # Device / browser traffic quality (session scope)
  - id: device_browser
    dimensions:
      - deviceCategory
      - browser
    metrics:
      - sessions
      - engagedSessions
      - engagementRate
      - averageSessionDuration
      - bounceRate
    limit: 200

  - id: device_os
    dimensions:
      - deviceCategory
      - operatingSystem
    metrics:
      - sessions
      - engagementRate
      - averageSessionDuration
    limit: 200

  - id: events_by_device_browser
    dimensions:
      - deviceCategory
      - browser
      - eventName
    metrics:
      - eventCount
    dimension_filter:
      field: eventName
      op: in_list
      values:
        - viewer_engagement
        - scene_dwell
        - image_load_fallback
    limit: 500

merge:
  insight_thresholds:
    low_ctr_vs_site_ratio: 0.7
    low_engagement_scroll_ratio: 0.5
    high_fallback_events: 50
    geo_min_sessions: 20
    geo_low_engagement_rate: 0.2
    geo_short_session_seconds: 10
    geo_low_viewer_ratio: 0.1
