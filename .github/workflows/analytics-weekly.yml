name: Analytics weekly fetch

# Weekly GSC + GA4 fetch (Pattern C — data layer).
# Reports are gitignored; upload as Actions artifacts for review / Automation.
# See docs/operations/analytics-pipeline.md

on:
  schedule:
    # Monday 06:00 JST = Sunday 21:00 UTC
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report folder name (YYYY-MM-DD). Empty = today in Asia/Tokyo'
        required: false
        type: string

concurrency:
  group: analytics-weekly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-analytics.txt

      - name: Resolve report date (JST)
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            REPORT_DATE="${{ github.event.inputs.report_date }}"
          else
            REPORT_DATE="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          fi
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "Report date: $REPORT_DATE"

      - name: Preflight analytics config
        env:
          GOOGLE_APPLICATION_PROPERTY_ID: ${{ secrets.GOOGLE_APPLICATION_PROPERTY_ID }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python scripts/analytics/check_analytics_config.py

      - name: Fetch GSC + GA4 reports
        env:
          GOOGLE_APPLICATION_PROPERTY_ID: ${{ secrets.GOOGLE_APPLICATION_PROPERTY_ID }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          python scripts/analytics/fetch_all.py --date "${{ steps.dates.outputs.report_date }}" --skip-config-check

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report-${{ steps.dates.outputs.report_date }}
          path: analytics/reports/${{ steps.dates.outputs.report_date }}/
          retention-days: 90
          if-no-files-found: error

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Analytics] Weekly fetch failed',
              body: [
                'The scheduled analytics fetch workflow failed.',
                '',
                `- Run: ${runUrl}`,
                `- Report date: ${{ steps.dates.outputs.report_date }}`,
                '',
                'Check Secrets (`GOOGLE_*`, `GSC_SITE_URL`) and GCP / GSC permissions.',
                'See docs/operations/analytics-pipeline.md',
              ].join('\n'),
            });
