name: Sync scroll to Cloudinary

# Cloudinary upload runs only via manual dispatch (no push trigger).
# Default: --skip-upload to avoid duplicate uploads after local sync.
# See docs/operations/scroll-pipeline.md

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to scroll_config.yaml (e.g. scrolls/my-scroll/scroll_config.yaml)'
        required: true
        type: string
      skip_upload:
        description: 'Skip Cloudinary upload (JSON only). Uncheck to upload from CI (opt-in).'
        required: false
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-sync.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node.js dependencies (for cache generation)
        run: npm ci
        env:
          CI: true

      - name: Validate config path
        run: |
          CONFIG="${{ github.event.inputs.config_path }}"
          echo "Config path: $CONFIG"
          echo "Skip upload: ${{ github.event.inputs.skip_upload }}"
          if [ ! -f "$CONFIG" ]; then
            echo "Error: Config not found: $CONFIG"
            exit 1
          fi
          head -20 "$CONFIG"

      - name: Run sync pipeline
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          CONFIG="${{ github.event.inputs.config_path }}"
          SKIP_FLAG="--skip-upload"
          if [ "${{ github.event.inputs.skip_upload }}" = "false" ]; then
            SKIP_FLAG=""
            if [ -z "$CLOUDINARY_URL" ]; then
              echo "Error: CLOUDINARY_URL secret is required when upload is enabled"
              exit 1
            fi
          fi
          python scripts/sync_all.py "$CONFIG" $SKIP_FLAG

      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dataEmakis.json (pipeline input) is kept only in local-data/ (gitignored),
          # so CI commits only the source-of-truth image-metadata-cache.
          git add src/data/image-metadata-cache/
          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
          else
            git commit -m "auto: regenerate JSON from YAML [skip ci]"
            git push
            echo "Committed and pushed JSON updates"
          fi
