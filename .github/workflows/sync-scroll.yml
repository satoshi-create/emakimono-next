name: Sync scroll to Cloudinary

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to scroll_config.yaml (e.g. scrolls/my-scroll/scroll_config.yaml)'
        required: false
        default: 'scrolls/_examples/choju-giga-yamazaki-tei/scroll_config.yaml'
      skip_upload:
        description: 'Skip Cloudinary upload (only update JSON)'
        required: false
        default: false
        type: boolean

  push:
    branches: [main, preview]
    paths:
      - 'scrolls/**/scroll_config.yaml'
      - 'scroll_config*.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-sync.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node.js dependencies (for cache generation)
        run: npm ci
        env:
          CI: true

      - name: Determine config path
        id: config
        run: |
          if [ -n "${{ github.event.inputs.config_path }}" ]; then
            echo "path=${{ github.event.inputs.config_path }}" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }}..${{ github.event.after }} -- 'scrolls/**/scroll_config.yaml' 'scroll_config*.yaml' | head -1)
            if [ -n "$CHANGED" ]; then
              echo "path=$CHANGED" >> $GITHUB_OUTPUT
            else
              echo "path=scrolls/_examples/choju-giga-yamazaki-tei/scroll_config.yaml" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Debug environment
        run: |
          echo "Config path: ${{ steps.config.outputs.path }}"
          echo "Skip upload: ${{ github.event.inputs.skip_upload }}"
          if [ -f "${{ steps.config.outputs.path }}" ]; then
            echo "Config file exists:"
            head -20 "${{ steps.config.outputs.path }}"
          else
            echo "Warning: Config file not found at ${{ steps.config.outputs.path }}"
          fi

      - name: Run sync pipeline
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          SKIP_FLAG=""
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            SKIP_FLAG="--skip-upload"
          fi
          python scripts/sync_all.py "${{ steps.config.outputs.path }}" $SKIP_FLAG

      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/json-data/dataEmakis.json src/data/image-metadata-cache/
          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
          else
            git commit -m "auto: regenerate JSON from YAML [skip ci]"
            git push
            echo "Committed and pushed JSON updates"
          fi
