scenes:
  - id: 1
    title: "欲色餓鬼"
    titleen: "Yokujiki Gaki"
    range: [1, 1]
    text:
      gendaibun: |
        欲色餓鬼（よくじきがき）とは、生前に売淫で得た財を施し、人を色欲に誘惑した者の報いである。<br><br>この餓鬼は心のままに姿を変え、美しくも醜くもなれる。人家に忍び入り盗み食いをし、あるいは女の形に化けて男と交わるという。絵では、琵琶を弾く遊女や貴族の宴の場に、人の目に見えぬ餓鬼が紛れている様子が描かれる。
      kobun: ""
      desc: |
        『正法念処経』第二十一に説かれる迦摩（欲色）餓鬼を描きます。この絵巻は詞書（こしき）を持たない絵のみの構成のため、解説は経典の記述に基づいています。画面では、琵琶を弾く遊女や宴の座のそばに、人の目に見えない餓鬼がひそむ様子が、現世の風俗と重ねて描かれます。
      descen: |
        This scene depicts the Gama (lustful) hungry ghost described in chapter 21 of the Shōbōnenjō-kyō. The scroll carries no written captions, so this commentary is based on the sutra text. Invisible to humans, the ghost haunts banquets and courtesan quarters, blending the otherworldly with the everyday customs of Heian life.
  - id: 2
    title: "伺嬰児便飢餓"
    titleen: "Shieijiben Kiga"
    range: [2, 2]
    text:
      gendaibun: |
        伺嬰児便餓鬼（しえいじべんがき）とは、生前に人の嬰児を殺され、大いに怒り、「来世は夜叉となって報いを受けさせる」と誓願した者の報いである。<br><br>産褥の場を伺い、赤子の過失を求めてその命を断とうとする。神通自在で、須臾の間に百千由旬を行き来するという。絵では出産の場に僧が座り、背後から女がのぞき込むなど、人間の営みと餓鬼の存在が交錯する。
      kobun: ""
      desc: |
        『正法念処経』第二十に説かれる蚩陀羅（伺嬰児便）餓鬼を描きます。生まれた子を殺された母が、「来世は夜叉となって報いを受ける」と誓った報いとされます。産褥（さんじょく）の場をうかがい、赤子の命を断とうとする姿は、人間の営みのすぐ隣に存在する餓鬼の世界を暗示します。絵では、産室のそばに僧の姿が描かれ、出産という現世の出来事と餓鬼の世界が対置されます。
      descen: |
        This is the Shieijiben hungry ghost of chapter 20 of the Shōbōnenjō-kyō, said to be the retribution for a mother who, having lost her child, swore to become a yaksha in the next life. The ghost watches over childbirth, waiting to take an infant's life—a reminder that the hungry ghost realm lies just beside human existence. In the painting, a monk sits by the birthing room, setting the ghostly world against the everyday event of childbirth.
  - id: 3
    title: "伺便飢餓"
    titleen: "Shiben Kiga"
    range: [3, 3]
    text:
      gendaibun: |
        伺便餓鬼（しべんがき）とは、生前に詐欺で財を奪い、人の隙を伺って劫掠した者の報いである。<br><br>全身の毛孔から火が出て自らを焼き、飢渇に苦しみながら、不浄な場所や大小便のそばをうろつき、人の便を待ち求める。絵では路傍や家の外で用を足す人々の周囲に、腹の膨れた餓鬼たちが群がる。
      kobun: ""
      desc: |
        『正法念処経』第十六に説かれる蚩陀邏（伺便）餓鬼を描きます。生前に詐欺で財を奪い、人の隙をうかがって略奪した者が、飢渇に苦しみながら人の排泄物を求めてさまよう姿が描かれます。全身の毛孔から火が出て自らを焼くという描写は、欲に焼かれる業を象徴します。路傍で用を足す人々のそばに、腹の膨れた餓鬼が群がる様子は、現世の風俗と業報を重ねるこの絵巻の手法をよく示しています。
      descen: |
        This is the Shiben hungry ghost of chapter 16 of the Shōbōnenjō-kyō, the retribution of those who swindled and robbed others in life. Tormented by hunger and thirst, it prowls near latrines seeking human waste. The flames that burn from its own pores symbolize the karma of craving. Ghosts with swollen bellies crowding beside people at their toilets is a fine example of the scroll's way of layering everyday Heian customs with karmic retribution.
  - id: 4
    title: "疾行飢餓"
    titleen: "Shikko Kiga"
    range: [4, 4]
    text:
      gendaibun: |
        疾行餓鬼（しっこうがき）とは、生前に出家して戒を破り、町村を徘徊して欺罔（ぎもう）の財を求めた者の報いである。<br><br>その行は迅疾で、一念の間に百千由旬に至る。不浄の場所で穢物を食べ、行不浄の人を悩ませ、悪夢を見せるという。絵では塚や卒塔婆のある野辺に、死体や骨をめぐって餓鬼がうろつく。
      kobun: ""
      desc: |
        『正法念処経』第十五に説かれる阿毘遮羅（疾行）餓鬼を描きます。生前に出家して戒律を破り、欺瞞の財を求めて村々を巡った者が、一念の間に百千由旬を走る速さを与えられた報いとされます。しかし、いくら走っても飢えは満たされず、不浄の物を食うとされます。絵では、塚や卒塔婆のある野辺を舞台に、死体や骨をめぐって餓鬼がうろつく異様な光景が広がります。
      descen: |
        This is the Abichara (swift) hungry ghost of chapter 15 of the Shōbōnenjō-kyō. A monk who broke his vows and wandered villages seeking ill-gotten wealth is punished with the ability to travel a hundred thousand yojanas in an instant—yet no distance can satisfy his hunger. In the painting, an eerie scene unfolds in a field of grave mounds and stupas, where ghosts prowl around corpses and bones.
  - id: 5
    title: "食糞飢餓"
    titleen: "Shokufun Kiga"
    range: [5, 5]
    text:
      gendaibun: |
        食糞餓鬼（しょくふんがき）とは、生前に慳貪で布施をせず、あるいは不浄な食物を僧に施した者の報いである。<br><br>人の糞尿を食とし、求めても得られず、飢渇の火に身を焼かれる。絵では泥水のたまりに身を沈め、穢物を口に運ぶ餓鬼が、同类とともに描かれる。
      kobun: ""
      desc: |
        『正法念処経』第四に説かれる毘師咃（食糞）餓鬼を描きます。生前に物惜しみして布施をせず、僧に不浄な食物を施した者が、人の糞尿を食とし、求めても得られず飢えに焼かれるとされます。詞書を持たないこの絵巻では、経典の記述を絵だけで伝えます。泥水のたまりに身を沈め、穢物を口に運ぶ餓鬼の姿は、施しの精神の欠如がもたらす業の結果を、容赦なく見せます。
      descen: |
        This is the Bishita (excrement-eating) hungry ghost of chapter 4 of the Shōbōnenjō-kyō. Those who were miserly, gave no alms, or offered unclean food to monks are condemned to eat human waste, seeking it in vain and burning with hunger. With no captions, the scroll relies entirely on imagery. A ghost sunk in muddy water, bringing filth to its mouth, unsparingly visualizes the karmic result of a life without generosity.
  - id: 6
    title: "曠野飢餓"
    titleen: "Koya Kiga"
    range: [6, 6]
    text:
      gendaibun: |
        曠野餓鬼（こうやがき）とは、生前に曠野の険しい所で強盗を働き、林木や水源を破壊して旅人の財を奪った者の報いである。<br><br>飢火に身を焼かれ曠野を奔走し、水を呼んでも近づけば消え、荊棘に足を刺され、雕鷲に目を啄まれるという。絵では野原に倒れた餓鬼の身上を、大きな鳥たちが襲う。
      kobun: ""
      desc: |
        『正法念処経』第三十二に説かれる阿吒毘（曠野）餓鬼を描きます。曠野で強盗を働き、林木や水源を壊して旅人の財を奪った者が、飢火に焼かれながら野原を奔走するとされます。水を呼んでも近づけば消え、荊棘（いばら）に足を刺され、雕鷲（ちょうじゅう）に目を啄まれるという記述が、その報いの苛烈さを物語ります。絵では、野に倒れた餓鬼の身上を大きな鳥たちが襲う、凄惨でありながら哀れを誘う場面が描かれます。
      descen: |
        This is the Ataibi (wilderness) hungry ghost of chapter 32 of the Shōbōnenjō-kyō. Those who robbed travelers on the road and destroyed trees and water sources are condemned to wander the plains, burning with hunger. Water vanishes when they approach, thorns pierce their feet, and great vultures peck at their eyes. The painting shows large birds attacking a ghost fallen in the field—a cruel yet pitiable scene.
  - id: 7
    title: "食火炭飢餓"
    titleen: "Shokukatan Kiga"
    range: [7, 7]
    text:
      gendaibun: |
        食火炭餓鬼（しょくかたんがき）とは、生前に刑獄を司り、囚人を飢渇させて虐待した者の報いである。<br><br>塚墓に至り、焼屍の火炭を食べて飢渇をしのぐ。絵では炎を携えた餓鬼や、口に火の粉を落とされて苦しむ餓鬼など、火と飢えの業報が一続きの画面に描かれる。
      kobun: ""
      desc: |
        『正法念処経』第三十に説かれる鴦伽囉婆叉（食火炭）餓鬼を描きます。刑獄を司り、囚人を飢えさせて虐待した者が、塚墓に至り焼屍の火炭を食べて飢えをしのぐとされます。詞書を持たないため、絵の連続だけで物語が語られます。炎を携えた餓鬼や、口に火の粉を落とされて苦しむ餓鬼が一続きの画面に並び、火と飢えに苛まれる業報が静かに、しかし容赦なく描かれます。
      descen: |
        This is the Onkara-hasha (fire-charcoal-eating) hungry ghost of chapter 30 of the Shōbōnenjō-kyō. Officials who starved and abused prisoners are condemned to eat the burning coals of cremated corpses in graveyards. Without captions, the story is told purely through the sequence of images. Ghosts bearing flames and others suffering as fire falls into their mouths appear in a single continuous scene, quietly but relentlessly depicting the retribution of fire and hunger.
