scenes:
  - id: 1
    title: "叫喚地獄第三別所・髪火流"
    titleen: "Kyokan Hell - 3rd Bessho: Hatsukaru"
    range: [1, 2]
    text:
      gendaibun: |
        ここは、生前、殺生、偸盗・邪淫・妄語をおこない、また五戒を守っている人に、言葉巧みに酒の功徳を説いて、酒を飲ませた者が落ちる。<br><br>この地獄には、熱鉄の犬や鉄の嘴を持った鷲がいて、足を咬み、頭蓋骨に穴を開けて、脳髄を飲むという。
      kobun: ""
      desc: ""
  - id: 2
    title: "叫喚地獄第四別所・火末虫"
    titleen: "Kyokan Hell - 4th Bessho: Kamatsumushi"
    range: [3, 4]
    text:
      gendaibun: |
        ここは、生前、殺生、偸盗・邪淫をおこない、また酒の中に水増しをして売り、巨利を得た者が落ちる。<br><br>この地獄の住人は、みずからの身体から数多（あまた）の虫がわき、肉体や骨の髄までも食いさいなまれる。その苦しみは耐えがたく、叫ぶ声が耐えない。
      kobun: ""
      desc: ""
  - id: 3
    title: "叫喚地獄第十五別所・雲火霧"
    titleen: "Kyokan Hell - 15th Bessho: Unkamu"
    range: [5, 6]
    text:
      gendaibun: |
        ここは、生前、殺生、偸盗・邪淫をおこない、また五戒を守っている人に酒を飲ませて酔わせ、たわむれてもてあそび、それを見て喜ぶ者が落ちる。<br><br>この地獄には業火（ごうか）が燃え盛り、その炎の厚さは二百肘もあるという。獄卒が罪人をつかまえては、この火の中に投げ込む。罪人は足の先から頭の先まで、焼け切って消え失せ、また蘇る。蘇ればまた焼く。このようなことがやむことはない。叫ぶ声が天に響く。
      kobun: ""
      desc: ""
  - id: 4
    title: "叫喚地獄第六別所・雨炎火石"
    titleen: "Kyokan Hell - 6th Bessho: Uenkaseki"
    range: [7, 8]
    text:
      gendaibun: |
        ここは、生前、殺生、偸盗・邪淫をおこない、また酒を用意して、遠い広野を旅行する人にそれを飲ませて酔わせる。酔いつぶれたころを見計らって、所持する財物のいっさいを奪い、ときにはそれを殺した者が落ちる地獄である。<br><br>この地獄は、炎のある焼け石が天から降り注いで罪人を焼き、また熱沸河という河があって、銅（あかがね）の湯、白鑞（びゃくろう）の湯と熱い血が混じって流れている。罪人どもは、常にこの河の中を泳いで苦しみを受け、泣き叫ぶ声が絶えぬという。
      kobun: ""
      desc: ""